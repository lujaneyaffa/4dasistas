backend:
  name: git-gateway
  repo: lujaneyaffa/4dasistas
  branch: main
  identity_url: https://auth.decapbridge.com/sites/0e272b00-698f-4375-beef-d82a66a2ca77
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>
      via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>
      via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}>
      via DecapBridge
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
media_folder: admin/uploads
public_folder: /admin/uploads
site_url: https://4dasistas.ca
display_url: https://4dasistas.ca
collections:
- name: maintenance
  label: Maintenance Mode
  files:
  - file: data/maintenance.json
    label: Maintenance Mode
    name: maintenance
    fields:
    - label: Show maintenance screen to visitors?
      name: enabled
      widget: boolean
      default: false
      hint: Turn this ON to hide the site behind a 'be right back' message.
    - label: Message shown to visitors
      name: message
      widget: string
      default: We're fixing something - be right back!
    - label: Smaller subtext
      name: subtext
      widget: string
      required: false
      default: This won't take long. Thanks for your patience!
- name: sitetext
  label: Page Text
  files:
  - file: data/sitetext.json
    label: Page Text
    name: sitetext
    fields:
    - label: Header subtitle
      name: headerDisclaimer
      widget: string
    - label: Footer tagline
      name: footerTagline
      widget: string
    - label: Footer fine print
      name: footerDisclaimer
      widget: text
    - label: Home tile - Calendar - title
      name: homeTileEventsTitle
      widget: string
    - label: Home tile - Calendar - description
      name: homeTileEventsDesc
      widget: text
    - label: Home tile - Travel - title
      name: homeTileTravelTitle
      widget: string
    - label: Home tile - Travel - description
      name: homeTileTravelDesc
      widget: text
    - label: Home tile - GALS CLUBS - title
      name: homeTileClubsTitle
      widget: string
    - label: Home tile - GALS CLUBS - description
      name: homeTileClubsDesc
      widget: text
    - label: Home tile - Resources - title
      name: homeTileResourcesTitle
      widget: string
    - label: Home tile - Resources - description
      name: homeTileResourcesDesc
      widget: text
    - label: Home tile - Add to Home Screen - title
      name: homeTileHomescreenTitle
      widget: string
    - label: Home tile - Add to Home Screen - description
      name: homeTileHomescreenDesc
      widget: text
    - label: Intro line - All Events
      name: introAll
      widget: text
    - label: Intro line - Sports
      name: introSports
      widget: text
    - label: Intro line - Activities
      name: introActivities
      widget: text
    - label: Intro line - Functions
      name: introFunctions
      widget: text
    - label: Intro line - Trips
      name: introTrips
      widget: text
    - label: Intro line - Knowledge
      name: introMosquePrograms
      widget: text
    - label: Intro line - CLUBS
      name: introClubs
      widget: text
    - label: Intro line - Resources
      name: introResources
      widget: text
    - label: Intro line - Travel tab
      name: introTravel
      widget: text
    - label: Intro line - Rules
      name: introRules
      widget: text
    - label: Intro line - Add to Home Screen
      name: introHomescreen
      widget: text
    - label: Intro line - How to Start a Club
      name: introClubstart
      widget: text
    - label: Intro line - How to Join a Club
      name: introClubjoin
      widget: text
- name: sports
  label: Sports
  folder: data/calendar
  extension: json
  format: json
  filter:
    field: section
    value: sports
  create: true
  slug: '{{title}}'
  identifier_field: title
  sortable_fields:
  - eventDate
  - endDate
  - title
  summary: '{{title}} - {{eventDate}}'
  fields:
  - label: Calendar tab (changing this OFFICIALLY MOVES the event)
    name: section
    widget: select
    default: sports
    options: &id001
    - sports
    - activities
    - functions
    - trips
    - mosqueprograms
    - supportprograms
  - label: Title
    name: title
    widget: string
  - label: Audience Type (required, select all that apply) — shown as pills on the
      event
    name: audienceType
    widget: select
    options:
    - Muslim Women
    - Hijabi Friendly
    - Family Event
    - All Women
    required: true
    multiple: true
    hint: '''All Women'' means open to all women regardless of faith - not exclusively
      Muslim. Most general events fall here. ''Muslim Women'' and ''Hijabi Friendly''
      are independently assessed - an event can be both.'
  - label: Emoji override (optional - leave blank to auto-pick one based on the event,
      e.g. sport/hike/country)
    name: emoji
    widget: string
    required: false
    pattern:
    - ^.{1,8}$
    - One emoji only
  - label: Organized by (optional - shows in italics under the title on the website)
    name: organizedBy
    widget: string
    required: false
  - label: Event date (required - pick from calendar)
    name: eventDate
    widget: date
    required: true
    hint: Pick a date - the site builds the display text and places it on the calendar.
      For recurring events, enter the next upcoming occurrence.
  - label: End date (optional - for multi-day events/festivals/trips)
    name: endDate
    widget: date
    required: false
  - label: Time (optional - shown on listings)
    name: time
    widget: datetime
    required: false
    date_format: false
    time_format: h:mm A
    format: HH:mm
  - label: End Time (optional)
    name: endTime
    widget: datetime
    required: false
    date_format: false
    time_format: h:mm A
    format: HH:mm
  - label: This event runs all day (check this instead of filling in times above)
    name: allDay
    widget: boolean
    default: false
    required: false
  - label: Recurring weekdays (leave empty if one-off)
    name: days
    widget: select
    multiple: true
    required: false
    options:
    - sun
    - mon
    - tue
    - wed
    - thu
    - fri
    - sat
  - label: 'Recurring: starts on (optional)'
    name: recurStart
    widget: date
    required: false
  - label: 'Recurring: ends on (optional)'
    name: recurEnd
    widget: date
    required: false
  - label: Extra one-off dates (optional - for a series on specific days that aren't
      every week, e.g. a 3-part workshop on Sept 1, 8 and 22)
    name: extraDates
    widget: list
    required: false
    field:
      label: Date
      name: date
      widget: date
  - label: This is a virtual/online event (no physical location)
    name: virtual
    widget: boolean
    default: false
    required: false
  - label: Location (used for the embedded map on the event page - leave blank if
      virtual)
    name: location
    widget: location-autocomplete
    required: false
  - label: Link (Instagram or WhatsApp)
    name: link
    widget: string
    required: false
    hint: One link only - Instagram post/profile or WhatsApp group invite.
  - label: Description
    name: desc
    widget: text
    required: false
  - label: calDate (internal)
    name: calDate
    widget: hidden
    required: false
  - label: Sport key (lowercase, ONE sport only, e.g. "badminton" - do NOT put multiple
      sports here separated by commas)
    name: sportKey
    widget: string
    required: false
  - label: Also list this event under these other sports too (optional, no limit -
      use this for multi-sport events instead of combining them in Sport Key above)
    name: alsoSportKeys
    widget: list
    required: false
  - label: Also show in these other calendars too (optional - no limit, event still
      counts once on "All Events")
    name: alsoShowIn
    widget: select
    multiple: true
    required: false
    options: &id002
    - sports
    - activities
    - functions
    - trips
    - mosqueprograms
    hint: Pick any other calendars this same event should ALSO appear in, in addition
      to its home calendar above. E.g. a hike could live in 'activities' but also
      be checked here for 'sports'.
