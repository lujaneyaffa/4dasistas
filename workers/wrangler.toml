name = "4dasistas"
main = "src/worker.js"
compatibility_date = "2024-01-01"

[triggers]
crons = ["0 13 * * *"] # 9:00 AM America/Toronto during daylight time

# KV namespace for storing site data
# Create with: wrangler kv namespace create SITE_DATA
[[kv_namespaces]]
binding = "SITE_DATA"
id = "f70e43c88d1043439e400e127faaf90e"
# Route API calls through this Worker while the main site remains on Netlify.
routes = [
	{ pattern = "4dasistas.ca/api/*", zone_name = "4dasistas.ca" },
	{ pattern = "www.4dasistas.ca/api/*", zone_name = "4dasistas.ca" }
]

# Environment variables
[vars]
SITE_ORIGIN = "https://4dasistas.ca"
FROM_EMAIL = "4DASISTAS <updates@4dasistas.ca>"
