# Deploys Lujane's painting shop as its own Cloudflare Worker, separate
# from the main 4dasistas.ca site. Serves the static gallery/admin pages
# from public/ and the /api/* routes from src/worker.js.
#
# One-time setup (from inside this Art/ folder):
#   npx wrangler login
#   npx wrangler secret put ADMIN_PASSWORD     (enter 122139 when prompted)
#   npx wrangler deploy
#
# After that, the site is live at https://lujane-art.<your-subdomain>.workers.dev
# (Cloudflare dashboard -> Workers & Pages -> lujane-art shows the exact URL).
# Re-run "npx wrangler deploy" from this folder any time you change worker.js
# or the public/ pages.

name = "lujane-art"
main = "src/worker.js"
compatibility_date = "2026-09-15"

[[kv_namespaces]]
binding = "ART_DATA"
id = "8643a9a1000f42788a5a9f97fdb502e8"

[assets]
directory = "public"
